:root,.dark {
  --background: #f8f9f5;
  --foreground: #24332d;
  --primary: #245b45;
  --border: #e0e5dc;
  --lime: #d9eb9b;
  --green: #245b45;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  color: var(--foreground);
  background: var(--background);
  font-family: 'Microsoft YaHei','PingFang SC',Arial,sans-serif;
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
}
button,a {
  -webkit-tap-highlight-color: transparent;
}
button {
  cursor: pointer;
  font: inherit;
  transition: background .15s,transform .15s;
}
button:disabled {
  cursor: not-allowed;
  opacity: .42;
}
button:focus-visible,a:focus-visible {
  outline: 3px solid #9bbe62;
  outline-offset: 4px;
}
a {
  color: inherit;
  text-decoration: none;
}
h1,h2,h3,p {
  margin: 0;
}
button svg {
  flex-shrink: 0;
}
.app-shell {
  max-width: 1800px;
  margin: auto;
}
.site-header {
  height: 88px;
  border-bottom: 1px solid var(--border);
  padding: 0 4%;
  display: flex;
  align-items: center;
  gap: 28px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 23px;
  font-weight: 800;
  letter-spacing: 1px;
  white-space: nowrap;
}
.brand-icon {
  width: 40px;
  height: 43px;
  background: var(--green);
  color: var(--lime);
  display: grid;
  place-items: center;
  border-radius: 11px 11px 17px 11px;
}
.brand-note {
  border-left: 1px solid #d8ded4;
  margin-left: 12px;
  padding-left: 23px;
  font-size: 13px;
  font-weight: 400;
  color: #7b857d;
  letter-spacing: 1px;
}
.header-note {
  margin-left: auto;
  font-size: 13px;
  color: #7a867d;
  display: flex;
  align-items: center;
  gap: 8px;
}
.status-dot {
  display: inline-block;
  width: 6px;
  height: 6px;
  background: #8ab563;
  border-radius: 50%;
  flex-shrink: 0;
}
.text-button {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  border: 0;
  background: transparent;
  padding: 8px 0;
  font-size: 14px;
  color: #68756c;
}
.text-button:hover {
  color: var(--green);
}
.main-layout {
  display: grid;
  grid-template-columns: minmax(0,1fr) 306px;
  gap: 30px;
  margin: 32px 4% 0;
  align-items: start;
}
.play-column {
  min-width: 0;
}
.page-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 25px;
}
.eyebrow {
  font-size: 13px;
  color: #86907e;
  letter-spacing: 2px;
  margin-bottom: 8px;
}
h1 {
  font-size: clamp(23px,2.15vw,32px);
  font-weight: 700;
  letter-spacing: 1px;
  line-height: 1.5;
}
h1>span {
  color: #779347;
}
.mode-pill {
  display: flex;
  gap: 6px;
  align-items: center;
  font-size: 12px;
  color: #52733a;
  background: #ecf1df;
  border: 1px solid #dce6c9;
  border-radius: 30px;
  padding: 8px 12px;
  white-space: nowrap;
}
.game-toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 15px;
}
.mode-tabs {
  display: flex;
  gap: 25px;
  font-size: 14px;
  color: #8a938c;
}
.mode-tabs span {
  padding: 5px 0 10px;
}
.mode-tabs .active {
  color: #2e5944;
  border-bottom: 2px solid #2e5944;
  font-weight: 600;
}
.felt-table {
  height: 365px;
  background: #235b46;
  border: 8px solid #e4e9df;
  outline: 1px solid #dce3d6;
  border-radius: 30px;
  position: relative;
  color: #fff;
  overflow: hidden;
  box-shadow: inset 0 0 0 1px #44715b,0 4px 14px #24332d07;
}
.felt-table::before {
  content: '';
  position: absolute;
  inset: 17px;
  border: 1px solid #ffffff14;
  border-radius: 82px;
  pointer-events: none;
}
.table-level {
  position: absolute;
  left: 25px;
  top: 21px;
  font-size: 13px;
  color: #bed3bd;
  display: flex;
  align-items: center;
  gap: 8px;
}
.table-level strong {
  font-family: Georgia,serif;
  color: #e6edce;
  font-size: 21px;
}
.table-level>span {
  border-left: 1px solid #789c7d70;
  padding-left: 10px;
  color: #a9c2ab;
  font-size: 12px;
}
.seat {
  position: absolute;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  z-index: 2;
  min-width: 90px;
  gap: 5px;
}
.seat-top {
  left: 50%;
  top: 19px;
  transform: translateX(-50%);
}
.seat-left {
  left: 28px;
  top: 132px;
}
.seat-right {
  right: 28px;
  top: 132px;
}
.avatar {
  border: 3px solid #ffffff24;
  width: 48px;
  height: 48px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  font-size: 20px;
  font-weight: 600;
  box-shadow: 0 3px 8px #102f3420;
}
.avatar.teammate {
  background: #d2e8b0;
  color: #426646;
}
.avatar.opponent {
  background: #f0e3c6;
  color: #6a6043;
}
.avatar.warm {
  background: #d7dfed;
  color: #556e82;
}
.seat strong {
  font-size: 14px;
  font-weight: 500;
}
.seat em {
  font-style: normal;
  font-size: 12px;
  padding: 2px 5px;
  color: #d6eabb;
  background: #ffffff18;
  border-radius: 4px;
  margin-left: 5px;
}
.seat small {
  font-size: 12px;
  color: #b2c9b8;
}
.card-backs {
  color: #d4e1c8;
  opacity: .6;
  letter-spacing: -4px;
  font-size: 21px;
  line-height: 1;
}
.table-center {
  position: absolute;
  top: 146px;
  left: 50%;
  transform: translateX(-50%);
  width: calc(100% - 230px);
  text-align: center;
}
.table-monogram {
  color: #a3bd862c;
  font-family: Georgia,'STKaiti','KaiTi',serif;
  font-size: 61px;
  line-height: 1;
}
.table-monogram span {
  display: block;
  font-family: Arial,sans-serif;
  font-size: 10px;
  letter-spacing: 4px;
  margin-top: 9px;
  color: #c2d4b843;
}
.table-center p {
  margin-top: 25px;
  font-size: 15px;
  display: flex;
  gap: 9px;
  align-items: center;
  justify-content: center;
  color: #e9eedb;
}
.table-center small {
  display: block;
  font-size: 12px;
  color: #a8c2ab;
  margin-top: 9px;
}
.table-you {
  position: absolute;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 12px;
  color: #bed3bdb3;
  white-space: nowrap;
}
.table-you span {
  margin: 0 10px;
}
.hand-area {
  padding: 22px 0 0;
}
.hand-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 18px;
  gap: 12px;
}
.hand-heading strong {
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 14px;
  font-weight: 600;
}
.you-dot {
  width: 26px;
  height: 26px;
  background: #e3eacb;
  color: #677445;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 12px;
}
.hand-heading small {
  font-size: 12px;
  font-weight: 400;
  color: #879080;
}
.hand-heading>span {
  color: #939b8d;
  font-size: 12px;
}
.preview-cards {
  display: flex;
  width: 100%;
  padding: 12px 4px 3px;
  justify-content: center;
}
.poker-card {
  width: 67px;
  height: 99px;
  flex-shrink: 0;
  border: 1px solid #cdd3c8;
  background: #fffefa;
  border-radius: 7px;
  box-shadow: 0 2px 3px #24332d13;
  position: relative;
  color: #2f3934;
  text-align: left;
  user-select: none;
}
.preview-cards .poker-card {
  margin-left: -25px;
}
.preview-cards .poker-card:first-child {
  margin-left: 0;
}
.poker-card.red {
  color: #bf5546;
}
.card-corner {
  position: absolute;
  top: 7px;
  left: 7px;
  display: flex;
  flex-direction: column;
  align-items: center;
  line-height: 1;
}
.card-corner b {
  font-family: Georgia,'Times New Roman',serif;
  font-size: 21px;
  font-weight: 600;
}
.card-corner span {
  font-family: Georgia,serif;
  font-size: 19px;
  margin-top: 3px;
}
.card-pip {
  position: absolute;
  right: 9px;
  bottom: 8px;
  font-size: 31px;
  font-family: Georgia,serif;
}
.actions {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin-top: 25px;
}
.button {
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 12px 25px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  font-size: 14px;
  font-weight: 600;
  min-height: 45px;
}
.button:hover:not(:disabled) {
  transform: translateY(-1px);
}
.button.secondary {
  background: #f8f9f5;
  color: #7b857a;
}
.button.hint {
  background: #eef2e2;
  border-color: #dce5c7;
  color: #658039;
}
.button.primary {
  background: var(--green);
  color: #fff;
  border-color: var(--green);
  padding-left: 42px;
  padding-right: 42px;
}
.hand-footnote {
  font-size: 12px;
  color: #939d8e;
  text-align: center;
  margin-top: 15px;
}
.coach-panel {
  background: #fffefb;
  border: 1px solid #e0e5d9;
  border-radius: 15px;
  padding: 23px 23px 0;
  margin-top: 5px;
  overflow: hidden;
}
.coach-heading {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 30px;
}
.coach-icon {
  width: 40px;
  height: 42px;
  flex-shrink: 0;
  background: #f0f4e3;
  border-radius: 11px;
  display: grid;
  place-items: center;
  color: #799441;
}
.coach-heading h2 {
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 3px;
}
.coach-heading small {
  font-size: 12px;
  color: #959e8c;
}
.live-tag {
  margin-left: auto;
  font-size: 12px;
  white-space: nowrap;
  color: #7a915a;
}
.lesson-meta {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: #8c9584;
}
.lesson-progress {
  height: 4px;
  background: #edf0e6;
  border-radius: 5px;
  margin: 11px 0 24px;
  overflow: hidden;
}
.lesson-progress i {
  display: block;
  background: #9ab566;
  height: 100%;
  width: 20%;
}
.coach-panel h3 {
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 12px;
  letter-spacing: .5px;
}
.coach-panel p {
  font-size: 14px;
  line-height: 1.85;
  color: #7c8578;
}
.coach-tip {
  background: #f5f6ec;
  border: 1px solid #e8ebd9;
  border-radius: 9px;
  padding: 15px;
  margin-top: 21px;
}
.coach-tip>span {
  color: #72834b;
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 13px;
  font-weight: 600;
}
.coach-tip p {
  margin-top: 7px;
  font-size: 14px;
  color: #879074;
}
.coach-next {
  background: #e7edda;
  border-color: #e7edda;
  color: #566e39;
  width: 100%;
  margin: 19px 0 25px;
  padding: 10px;
  font-size: 14px;
}
.quick-heading {
  font-size: 12px;
  color: #939b8b;
  border-top: 1px solid #e8ebdf;
  padding-top: 23px;
  padding-bottom: 17px;
}
.learn-item {
  display: flex;
  gap: 13px;
  align-items: center;
  margin-bottom: 21px;
}
.learn-item>span {
  width: 28px;
  height: 28px;
  background: #f1f3e9;
  color: #8a986e;
  border-radius: 7px;
  display: grid;
  place-items: center;
  font-size: 12px;
  font-family: Georgia,serif;
}
.learn-item strong {
  font-size: 14px;
  font-weight: 500;
  display: block;
  margin-bottom: 4px;
}
.learn-item small {
  color: #9aa18f;
  font-size: 12px;
}
.coach-footer {
  margin: 7px -23px 0;
  padding: 16px;
  background: #f7f8f1;
  border-top: 1px solid #e9ecdf;
  display: flex;
  gap: 8px;
  justify-content: center;
  color: #89977a;
  font-size: 12px;
}
.site-footer {
  display: flex;
  justify-content: space-between;
  margin: 31px 4% 0;
  border-top: 1px solid var(--border);
  padding: 20px 0;
  font-size: 12px;
  color: #9aa28f;
  letter-spacing: .3px;
}
.site-footer i {
  margin: 0 9px;
  font-style: normal;
}
@media (min-width:1500px) {
  .main-layout {
    grid-template-columns: minmax(0,1fr) 336px;
    gap: 40px;
  }
  .felt-table {
    height: 425px;
  }
  .table-center {
    top: 180px;
  }
  .seat-left,.seat-right {
    top: 160px;
  }
  .coach-panel {
    padding-top: 28px;
  }
}
@media (max-width:1100px) {
  .brand-note,.header-note {
    display: none;
  }
  .site-header>.text-button {
    margin-left: auto;
  }
  .main-layout {
    gap: 20px;
    grid-template-columns: minmax(0,1fr) 280px;
    margin-left: 3%;
    margin-right: 3%;
  }
  .preview-cards .poker-card {
    margin-left: -38px;
  }
  .coach-panel {
    padding-left: 18px;
    padding-right: 18px;
  }
  .mode-pill {
    display: none;
  }
  .table-level>span {
    display: none;
  }
}
@media (max-width:850px) {
  .main-layout {
    grid-template-columns: minmax(0,1fr);
    margin-top: 22px;
  }
  .coach-panel {
    margin-top: 4px;
  }
  .coach-heading {
    margin-bottom: 20px;
  }
  .learn-item,.quick-heading {
    display: none;
  }
  .coach-next {
    margin-bottom: 15px;
  }
  .coach-footer {
    margin-top: 10px;
  }
  .site-header {
    height: 70px;
  }
  .brand {
    font-size: 20px;
  }
  .preview-cards .poker-card {
    margin-left: -27px;
  }
  .site-footer {
    margin-top: 24px;
  }
}
@media (max-width:540px) {
  .main-layout {
    margin-left: 14px;
    margin-right: 14px;
  }
  .page-heading {
    margin-bottom: 18px;
  }
  h1 {
    font-size: 23px;
  }
  .felt-table {
    height: 340px;
    border-width: 5px;
    border-radius: 23px;
  }
  .felt-table::before {
    inset: 12px;
    border-radius: 42px;
  }
  .seat-left {
    left: 9px;
    top: 137px;
  }
  .seat-right {
    right: 9px;
    top: 137px;
  }
  .seat {
    min-width: 62px;
  }
  .avatar {
    width: 40px;
    height: 40px;
    font-size: 18px;
  }
  .table-level {
    left: 16px;
    font-size: 12px;
    top: 16px;
  }
  .table-center {
    width: calc(100% - 130px);
    top: 147px;
  }
  .table-center p {
    margin-top: 21px;
    font-size: 14px;
  }
  .table-center small {
    font-size: 12px;
  }
  .table-monogram {
    font-size: 49px;
  }
  .table-monogram span {
    font-size: 10px;
    letter-spacing: 2px;
  }
  .preview-cards {
    overflow-x: auto;
    justify-content: flex-start;
  }
  .preview-cards .poker-card {
    margin-left: -31px;
  }
  .hand-heading>span {
    max-width: 140px;
    text-align: right;
