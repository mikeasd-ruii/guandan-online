:root,.dark {
  --background: #f8f9f5;
  --foreground: #24332d;
  --primary: #245b45;
  --border: #e0e5dc;
  --lime: #d9eb9b;
  --green: #245b45;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  color: var(--foreground);
  background: var(--background);
  font-family: 'Microsoft YaHei','PingFang SC',Arial,sans-serif;
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
}
button,a {
  -webkit-tap-highlight-color: transparent;
}
button {
  cursor: pointer;
  font: inherit;
  transition: background .15s,transform .15s;
}
button:disabled {
  cursor: not-allowed;
  opacity: .42;
}
button:focus-visible,a:focus-visible {
  outline: 3px solid #9bbe62;
  outline-offset: 4px;
}
a {
  color: inherit;
  text-decoration: none;
}
h1,h2,h3,p {
  margin: 0;
}
button svg {
  flex-shrink: 0;
}
.app-shell {
  max-width: 1800px;
  margin: auto;
}
.site-header {
  height: 88px;
  border-bottom: 1px solid var(--border);
  padding: 0 4%;
  display: flex;
  align-items: center;
  gap: 28px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 23px;
  font-weight: 800;
  letter-spacing: 1px;
  white-space: nowrap;
}
.brand-icon {
  width: 40px;
  height: 43px;
  background: var(--green);
  color: var(--lime);
  display: grid;
  place-items: center;
  border-radius: 11px 11px 17px 11px;
}
.brand-note {
  border-left: 1px solid #d8ded4;
  margin-left: 12px;
  padding-left: 23px;
  font-size: 13px;
  font-weight: 400;
  color: #7b857d;
  letter-spacing: 1px;
}
.header-note {
  margin-left: auto;
  font-size: 13px;
  color: #7a867d;
  display: flex;
  align-items: center;
  gap: 8px;
}
.status-dot {
  display: inline-block;
  width: 6px;
  height: 6px;
  background: #8ab563;
  border-radius: 50%;
  flex-shrink: 0;
}
.text-button {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  border: 0;
  background: transparent;
  padding: 8px 0;
  font-size: 14px;
  color: #68756c;
}
.text-button:hover {
  color: var(--green);
}
.main-layout {
  display: grid;
  grid-template-columns: minmax(0,1fr) 306px;
  gap: 30px;
  margin: 32px 4% 0;
  align-items: start;
}
.play-column {
  min-width: 0;
}
.page-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 25px;
}
.eyebrow {
  font-size: 13px;
  color: #86907e;
  letter-spacing: 2px;
  margin-bottom: 8px;
}
h1 {
  font-size: clamp(23px,2.15vw,32px);
  font-weight: 700;
  letter-spacing: 1px;
  line-height: 1.5;
}
h1>span {
  color: #779347;
}
.mode-pill {
  display: flex;
  gap: 6px;
  align-items: center;
  font-size: 12px;
  color: #52733a;
  background: #ecf1df;
  border: 1px solid #dce6c9;
  border-radius: 30px;
  padding: 8px 12px;
  white-space: nowrap;
}
.game-toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 15px;
}
.mode-tabs {
  display: flex;
  gap: 25px;
  font-size: 14px;
  color: #8a938c;
}
.mode-tabs span {
  padding: 5px 0 10px;
}
.mode-tabs .active {
  color: #2e5944;
  border-bottom: 2px solid #2e5944;
  font-weight: 600;
}
.felt-table {
  height: 365px;
  background: #235b46;
  border: 8px solid #e4e9df;
  outline: 1px solid #dce3d6;
  border-radius: 30px;
  position: relative;
  color: #fff;
  overflow: hidden;
  box-shadow: inset 0 0 0 1px #44715b,0 4px 14px #24332d07;
}
.felt-table::before {
  content: '';
  position: absolute;
  inset: 17px;
  border: 1px solid #ffffff14;
  border-radius: 82px;
  pointer-events: none;
}
.table-level {
  position: absolute;
  left: 25px;
  top: 21px;
  font-size: 13px;
  color: #bed3bd;
  display: flex;
  align-items: center;
  gap: 8px;
}
.table-level strong {
  font-family: Georgia,serif;
  color: #e6edce;
  font-size: 21px;
}
.table-level>span {
  border-left: 1px solid #789c7d70;
  padding-left: 10px;
  color: #a9c2ab;
  font-size: 12px;
}
.seat {
  position: absolute;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  z-index: 2;
  min-width: 90px;
  gap: 5px;

  max-width: calc(100% - 32px) !important;
  max-height: 80dvh;
  padding: 26px;
  background: #fffefa;
  overflow: hidden;
}
.history-list {
  max-height: 53dvh;
  overflow-y: auto;
  padding-right: 6px;
}
.history-row {
  display: flex;
  align-items: start;
  gap: 15px;
  border-bottom: 1px solid #e7ebdf;
  padding: 14px 0;
}
.history-row>span {
  font-family: Georgia,serif;
  color: #a9b09e;
  font-size: 13px;
  min-width: 22px;
}
.history-row>strong {
  font-size: 14px;
  min-width: 30px;
  color: #897957;
}
.history-row .our-team {
  color: #518162;
}
.history-row b {
  font-size: 13px;
  font-weight: 500;
  color: #617452;
}
.history-row p {
  font-size: 13px;
  line-height: 1.7;
  color: #8e9982;
  margin-top: 4px;
}
.history-empty {
  text-align: center;
  padding: 50px 20px;
  color: #9ca68f;
  font-size: 14px;
}
.result-dialog[data-slot=dialog-content] {
  width: 510px;
  max-width: calc(100% - 32px) !important;
  max-height: 90dvh;
  overflow-y: auto;
  padding: 30px;
  background: #fffefa;
  border-radius: 20px;
  text-align: center;
}
.result-trophy {
  display: grid;
  place-items: center;
  width: 70px;
  height: 70px;
  border-radius: 50%;
  background: #f0f3dc;
  color: #94a957;
  margin: 4px auto 14px;
}
.result-title {
  font-size: 25px;
  font-weight: 700;
  color: #355438;
}
.result-places {
  display: grid;
  grid-template-columns: repeat(4,1fr);
  background: #f3f6eb;
  padding: 17px 8px;
  border-radius: 10px;
}
.result-places>div {
  display: flex;
  flex-direction: column;
  gap: 8px;
  border-right: 1px solid #e0e8d0;
}
.result-places>div:last-child {
  border: 0;
}
.result-places span {
  font-size: 12px;
  color: #8b9b70;
}
.result-places strong {
  font-size: 16px;
  color: #536c44;
}
.result-places small {
  font-size: 12px;
  color: #96a385;
}
.result-summary {
  display: flex;
  justify-content: space-between;
  color: #8e9b7d;
  font-size: 12px;
  gap: 10px;
}
.result-dialog .coach-tip {
  text-align: left;
  margin-top: 0;
}
.result-dialog .coach-tip p {
  font-size: 14px;
  color: #7f8f6c;
  line-height: 1.8;
  margin-top: 7px;
}
.result-again {
  width: 100%;
}
.result-dialog>.text-button {
  font-size: 12px;
}
.site-footer {
  margin-top: 23px;
}
@media (min-width:1500px) {
  .table-center.has-play {
    top: 195px;
  }
  .hand-cards .poker-card {
    width: 71px;
    height: 106px;
  }
  .hand-cards {
    padding-right: 49px;
    max-width: calc(var(--card-count)*36px + 45px);
  }
}
@media (max-width:1100px) {
  .hand-cards {
    padding-right: 35px;
  }
  .hand-cards .poker-card {
    width: 56px;
    height: 91px;
  }
  .hand-cards .card-corner {
    left: 5px;
  }
  .hand-cards .card-corner b {
    font-size: 18px;
  }
  .hand-cards .card-corner span {
    font-size: 17px;
  }
  .coach-footer {
    width: calc(100% + 36px);
    margin-left: -18px;
    margin-right: -18px;
  }
}
@media (max-width:850px) {
  .coach-panel {
    margin-top: 9px;
  }
  .coach-panel .learn-item {
    display: none;
  }
  .coach-panel .quick-heading {
    display: none;
  }
  .hand-cards {
    padding-right: 40px;
  }
  .hand-cards .poker-card {
    width: 62px;
    height: 96px;
  }
  .hand-cards .card-corner b {
    font-size: 21px;
  }
  .hand-cards .card-corner span {
    font-size: 18px;
  }
  .hand-heading {
    margin-bottom: 12px;
  }
  .coach-panel .coach-heading {
    margin-bottom: 19px;
  }
  .coach-panel .lesson-progress {
    margin-bottom: 18px;
  }
  .coach-panel .coach-tip {
    margin-top: 15px;
  }
  .coach-panel .coach-next {
    margin-top: 16px;
  }
  .hand-bottom {
    margin-top: 13px;
  }
}
@media (max-width:600px) {
  .hand-cards {
    grid-template-columns: repeat(min(var(--card-count),14),minmax(0,1fr));
    gap: 17px 0;
    padding: 15px 34px 3px 0;
    max-width: calc(min(var(--card-count),14)*35px + 35px);
  }
  .hand-cards .poker-card {
    width: 56px;
    height: 82px;
  }
  .hand-cards .card-corner {
    left: 5px;
    top: 5px;
  }
  .hand-cards .card-corner b {
    font-size: 18px;
  }
  .hand-cards .card-corner span {
    font-size: 16px;
  }
  .hand-cards .card-pip {
    font-size: 25px;
    bottom: 12px;
    right: 6px;
  }
  .hand-cards .card-corner i {
    font-size: 9px;
    margin-top: 2px;
  }
  .hand-cards .poker-card.selected {
    transform: translateY(-10px);
  }
  .table-center.has-play {
    top: 157px;
  }
  .played-heading {
    font-size: 12px;
    margin-bottom: 10px;
  }
  .played-cards .poker-card {
    width: 36px;
    height: 58px;
  }
  .played-cards .poker-card+.poker-card {
    margin-left: -17px;
  }
  .table-center.has-play p {
    font-size: 13px;
    margin-top: 13px;
  }
  .table-center.has-play small {
    font-size: 12px;
  }
  .hand-area {
    padding-top: 20px;
  }
  .selection-status {
    font-size: 12px;
    padding: 0 5px;
  }
  .feedback {
    font-size: 12px;
    padding: 0 5px;
  }
  .button {
    padding: 11px 24px;
  }
  .button.primary {
    padding-left: 32px;
    padding-right: 32px;
  }
  .rules-dialog[data-slot=dialog-content] {
    padding: 24px 18px;
  }
  .rule-hands {
    grid-template-columns: 1fr;
  }
  .rule-hand {
    flex-direction: row;
    align-items: center;
    gap: 15px;
  }
  .rule-hand>div:first-child {
    max-width: 51%;
  }
  .example-cards .poker-card {
    width: 33px;
    height: 52px;
  }
  .example-cards .poker-card+.poker-card {
    margin-left: -13px;
  }
  .example-cards .card-corner b {
    font-size: 14px;
  }
  .example-cards .card-pip {
    font-size: 14px;
  }
  .rule-callout {
    font-size: 12px;
  }
  .dialog-title {
    font-size: 22px;
  }
  .table-pause {
    right: 17px;
    top: 17px;
  }
  .hand-interpretations {
    padding: 0 5px;
  }
  .result-dialog[data-slot=dialog-content] {
    padding: 26px 20px;
  }
  .result-title {
    font-size: 22px;
  }
}
.hand-cards .poker-card.selected,.hand-cards .poker-card:hover:not(:disabled) {
  z-index: auto;
}
