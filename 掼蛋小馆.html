:root,.dark {

  border-top: 3px solid #a9bd6f;
  background: #fffff6;
}
.card-corner i {

  font-family: 'Microsoft YaHei',sans-serif;
  display: block;
  color: #7e903d;
  font-size: 10px;
  font-weight: 600;
  background: #edf1d8;
  border-radius: 3px;
  padding: 2px;
  margin-top: 3px;
}
.selection-status {
  min-height: 25px;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px;
  margin-top: 13px;
  font-size: 12px;
  color: #74836b;
  text-align: center;
}
.selection-status.invalid {
  color: #b4774e;
}
.selection-status button {
  display: flex;
  align-items: center;
  gap: 3px;
  background: transparent;
  border: 0;
  color: #8b9585;
  font-size: 12px;
  padding: 4px;
}
.hand-interpretations {
  display: flex !important;
  flex-wrap: wrap;
  justify-content: center;
  margin-top: 8px;
  gap: 12px !important;
}
.hand-interpretations label {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: #65764f;
  cursor: pointer;
}
.hand-area .actions {
  margin-top: 10px;
}
.feedback {
  min-height: 22px;
  margin-top: 13px;
  text-align: center;
  color: #87917f;
  font-size: 12px;
  line-height: 1.7;
}
.hand-bottom {
  display: flex;
  justify-content: center;
  gap: 25px;
  align-items: center;
  font-size: 12px;
  color: #909b86;
  margin-top: 13px;
}
.hand-bottom i {
  font-style: normal;
  margin: 0 5px;
}
.hand-bottom .text-button {
  font-size: 12px;
  padding: 2px;
}
.coach-panel .lesson-progress {
  display: flex;
  margin-bottom: 24px;
  height: auto;
  min-height: 4px;
}
.lesson-progress [data-slot=progress-track] {
  background: #edf0e6;
}
.lesson-progress [data-slot=progress-indicator] {
  background: #9ab566;
}
.learn-item {
  border: 0;
  background: transparent;
  padding: 0;
  width: 100%;
  text-align: left;
  border-radius: 6px;
}
.learn-item:hover strong {
  color: #7d994c;
}
.coach-footer {
  width: calc(100% + 46px);
  border-left: 0;
  border-right: 0;
  border-bottom: 0;
  cursor: pointer;
}
.coach-footer:hover {
  background: #f0f4e7;
}
.live-coach-title {
  margin-top: 24px;
}
.empty-hand {
  min-height: 120px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  color: #6e854e;
}
.empty-hand strong {
  font-size: 16px;
}
.empty-hand span {
  font-size: 12px;
  color: #8b9880;
}
.rules-dialog[data-slot=dialog-content] {
  width: 780px;
  max-width: calc(100% - 32px) !important;
  max-height: 86dvh;
  padding: 28px;
  overflow-y: auto;
  background: #fffefa;
  border-radius: 20px;
}
.dialog-title {
  font-size: 25px;
  font-weight: 700;
  color: #2c4737;
  margin-bottom: 8px;
}
.rules-dialog [data-slot=dialog-description],.history-dialog [data-slot=dialog-description],.result-dialog [data-slot=dialog-description] {
  font-size: 14px;
  line-height: 1.8;
  color: #829078;
}
.rules-tabs {
  margin-top: 8px;
  margin-bottom: 14px;
  background: #edf1e4 !important;
  height: 41px !important;
  width: 100% !important;
  padding: 4px !important;
  gap: 4px;
}
.rules-tabs [data-slot=tabs-trigger] {
  font-size: 14px;
  height: 33px;
}
.rules-tabs [data-active] {
  background: #fffefa !important;
  color: #3d5c38 !important;
}
.rule-hands {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.rule-hand {
  padding: 15px;
  border: 1px solid #e7ebde;
  border-radius: 10px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 10px;
  background: #fafbf5;
}
.rule-hand strong {
  font-size: 15px;
  color: #3a513b;
}
.rule-hand p {
  font-size: 12px;
  color: #829078;
  line-height: 1.7;
  margin-top: 5px;
}
.example-cards {
  display: flex;
  padding-right: 5px;
}
.example-cards .poker-card+.poker-card {
  margin-left: -9px;
}
.rule-callout {
  font-size: 13px;
  line-height: 1.9;
  color: #718049;
  background: #f1f4e5;
  padding: 15px;
  border-radius: 9px;
  margin-top: 15px;
}
.rule-prose {
  font-size: 15px;
  line-height: 1.9;
  color: #77836e;
}
.rule-prose h3 {
  font-size: 17px;
  font-weight: 600;
  color: #405939;
  margin: 20px 0 7px;
}
.rule-prose h3:first-child {
  margin-top: 5px;
}
.rule-prose section {
  margin-bottom: 23px;
}
.source-link {
  display: inline-block;
  margin-top: 18px;
  font-size: 12px;
  color: #5e7842;
  text-decoration: underline;
  text-underline-offset: 4px;
}
.history-dialog[data-slot=dialog-content] {
  width: 560px;
  max-width: calc(100% - 32px) !important;
  max-height: 80dvh;
  padding: 26px;
  background: #fffefa;
  overflow: hidden;
}
.history-list {
  max-height: 53dvh;
  overflow-y: auto;
  padding-right: 6px;
}
.history-row {
  display: flex;
  align-items: start;
  gap: 15px;
  border-bottom: 1px solid #e7ebdf;
  padding: 14px 0;
}
.history-row>span {
  font-family: Georgia,serif;
  color: #a9b09e;
  font-size: 13px;
  min-width: 22px;
}
.history-row>strong {
  font-size: 14px;
  min-width: 30px;
  color: #897957;
}
.history-row .our-team {
  color: #518162;
}
.history-row b {
  font-size: 13px;
  font-weight: 500;
  color: #617452;
}
.history-row p {
  font-size: 13px;
  line-height: 1.7;
  color: #8e9982;
  margin-top: 4px;
}
.history-empty {
  text-align: center;
  padding: 50px 20px;
  color: #9ca68f;
  font-size: 14px;
}
.result-dialog[data-slot=dialog-content] {
  width: 510px;
  max-width: calc(100% - 32px) !important;
  max-height: 90dvh;
  overflow-y: auto;
  padding: 30px;
  background: #fffefa;
  border-radius: 20px;
  text-align: center;
}
.result-trophy {
  display: grid;
  place-items: center;
  width: 70px;
  height: 70px;
  border-radius: 50%;
  background: #f0f3dc;
  color: #94a957;
  margin: 4px auto 14px;
}
.result-title {
  font-size: 25px;
  font-weight: 700;
  color: #355438;
}
.result-places {
  display: grid;
  grid-template-columns: repeat(4,1fr);
  background: #f3f6eb;
  padding: 17px 8px;
  border-radius: 10px;
}
.result-places>div {
  display: flex;
  flex-direction: column;
  gap: 8px;
  border-right: 1px solid #e0e8d0;
}
.result-places>div:last-child {
  border: 0;
}
.result-places span {
  font-size: 12px;
  color: #8b9b70;
}
.result-places strong {
  font-size: 16px;
  color: #536c44;
}
.result-places small {
  font-size: 12px;
  color: #96a385;
}
.result-summary {
  display: flex;
  justify-content: space-between;
  color: #8e9b7d;
  font-size: 12px;
  gap: 10px;
}
.result-dialog .coach-tip {
  text-align: left;
  margin-top: 0;
}
.result-dialog .coach-tip p {
  font-size: 14px;
  color: #7f8f6c;
  line-height: 1.8;
  margin-top: 7px;
}
.result-again {
  width: 100%;
}
.result-dialog>.text-button {
  font-size: 12px;
}
.site-footer {
  margin-top: 23px;
}
@media (min-width:1500px) {
  .table-center.has-play {
    top: 195px;
  }
  .hand-cards .poker-card {
    width: 71px;
    height: 106px;
  }
  .hand-cards {
    padding-right: 49px;
    max-width: calc(var(--card-count)*36px + 45px);
  }
}
@media (max-width:1100px) {
  .hand-cards {
    padding-right: 35px;
  }
  .hand-cards .poker-card {
    width: 56px;
    height: 91px;
  }
  .hand-cards .card-corner {
    left: 5px;
  }
  .hand-cards .card-corner b {
    font-size: 18px;
  }
  .hand-cards .card-corner span {
    font-size: 17px;
  }

  }
}

  .coach-panel .learn-item {

  }
  .coach-panel .quick-heading {
    display: none;
  }
  .hand-cards {
    padding-right: 40px;
  }
  .hand-cards .poker-card {
    width: 62px;
    height: 96px;
  }
  .hand-cards .card-corner b {
    font-size: 21px;
  }
  .hand-cards .card-corner span {
    font-size: 18px;
  }
  .hand-heading {
    margin-bottom: 12px;
  }
  .coach-panel .coach-heading {
    margin-bottom: 19px;
  }
  .coach-panel .lesson-progress {
    margin-bottom: 18px;
  }
  .coach-panel .coach-tip {
    margin-top: 15px;
  }
  .coach-panel .coach-next {
    margin-top: 16px;
  }
  .hand-bottom {
    margin-top: 13px;
  }
}
@media (max-width:600px) {
  .hand-cards {
    grid-template-columns: repeat(min(var(--card-count),14),minmax(0,1fr));
    gap: 17px 0;
    padding: 15px 34px 3px 0;
    max-width: calc(min(var(--card-count),14)*35px + 35px);
  }
  .hand-cards .poker-card {
    width: 56px;
    height: 82px;
  }
  .hand-cards .card-corner {
    left: 5px;
    top: 5px;
  }
  .hand-cards .card-corner b {
    font-size: 18px;
  }
  .hand-cards .card-corner span {
    font-size: 16px;
  }
  .hand-cards .card-pip {
    font-size: 25px;
    bottom: 12px;
    right: 6px;
  }
  .hand-cards .card-corner i {
    font-size: 9px;
    margin-top: 2px;
  }
  .hand-cards .poker-card.selected {
    transform: translateY(-10px);
  }
  .table-center.has-play {
    top: 157px;
  }
  .played-heading {
    font-size: 12px;
    margin-bottom: 10px;
  }
  .played-cards .poker-card {
    width: 36px;
    height: 58px;
  }
  .played-cards .poker-card+.poker-card {
    margin-left: -17px;
  }
  .table-center.has-play p {
    font-size: 13px;
    margin-top: 13px;
  }
  .table-center.has-play small {
    font-size: 12px;
  }
  .hand-area {
    padding-top: 20px;
  }
  .selection-status {
    font-size: 12px;
    padding: 0 5px;
  }
  .feedback {
    font-size: 12px;
    padding: 0 5px;
  }
  .button {
    padding: 11px 24px;
  }
  .button.primary {
    padding-left: 32px;
    padding-right: 32px;
  }
  .rules-dialog[data-slot=dialog-content] {
    padding: 24px 18px;
  }
  .rule-hands {
    grid-template-columns: 1fr;
  }
  .rule-hand {
    flex-direction: row;
    align-items: center;
    gap: 15px;
  }
  .rule-hand>div:first-child {
    max-width: 51%;
  }
  .example-cards .poker-card {
    width: 33px;
    height: 52px;
  }
  .example-cards .poker-card+.poker-card {
    margin-left: -13px;
  }
  .example-cards .card-corner b {
    font-size: 14px;
  }
  .example-cards .card-pip {
    font-size: 14px;
  }
  .rule-callout {
    font-size: 12px;
  }
  .dialog-title {
    font-size: 22px;
  }
  .table-pause {
    right: 17px;
    top: 17px;
  }
  .hand-interpretations {
    padding: 0 5px;
  }
  .result-dialog[data-slot=dialog-content] {
    padding: 26px 20px;
  }
  .result-title {
    font-size: 22px;
  }
}
.hand-cards .poker-card.selected,.hand-cards .poker-card:hover:not(:disabled) {
  z-index: auto;
